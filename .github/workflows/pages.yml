name: Publish catalog browser

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'catalog/**'
      - 'review/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static catalog
        run: PYTHONDONTWRITEBYTECODE=1 python3 site/build.py "$RUNNER_TEMP/catalog-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/catalog-pages
      - uses: actions/deploy-pages@v4
        id: deployment
